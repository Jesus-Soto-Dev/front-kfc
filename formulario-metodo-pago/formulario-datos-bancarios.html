<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container"> 
    <h2 class="fw-bold text-uppercase title-form">Datos bancarios</h2>
    <form action="" class="row row-cols-1 
    row-cols-md-2
    row-cols-lg-1">

        <div class="col d-flex flex-column m-4 m-lg-0 my-lg-5">
            <div class="form-floating floating-bottom">
                <input 
                    type="text" 
                    name="nombre-banco" 
                    id="nombre-banco" 
                    class="form-control" 
                    placeholder=" "
                    required>
                <label for="sitio-web">Nombre del banco *</label>
                <div class="invalid-feedback">
                        Ingresa el nombre del banco
                </div>
            </div>
        </div>

         <div class="col d-flex flex-column m-4 m-lg-0 my-lg-5">
            <div class="form-floating floating-bottom">
                <input 
                    type="text" 
                    name="numero-iban" 
                    id="numero-iban" 
                    class="form-control" 
                    placeholder=" "
                    required>
                <label for="sitio-web">Numero de cuenta (IBAN) *</label>
                <div class="invalid-feedback">
                        Ingresa el IBAN
                </div>
            </div>
        </div>

        
         <div class="col d-flex flex-column m-4 m-lg-0 my-lg-5">
            <div class="form-floating floating-bottom">
                <input 
                    type="text" 
                    name="swift-bic" 
                    id="swift-bic" 
                    class="form-control" 
                    placeholder=" "
                    required>
                <label for="sitio-web">Swift/BIC*</label>
                <div class="invalid-feedback">
                        Ingresa el Swift/BIC
                </div>
            </div>
        </div>

<div class="col d-flex flex-column m-4 m-lg-0 my-lg-5 custom-select-container">
  <div class="label-with-icon d-flex flex-column align-items-start">
    <label class="text-start">Tipo de cuenta *</label>
    <i class="bi bi-caret-down-fill"></i>
  </div>

  <div class="custom-select-trigger"></div>
  <ul class="custom-select-options">
    <li data-value="Corriente">Corriente</li>
    <li data-value="Ahorro">Ahorro</li>
  </ul>

  <input type="hidden" name="tipo-cuenta" id="tipo-cuenta">
</div>

            <div class="col d-flex flex-column m-4 m-lg-0 my-lg-5">
            <div class="form-floating floating-bottom">
                <input 
                    type="text" 
                    name="sucursal" 
                    id="sucursal" 
                    class="form-control" 
                    placeholder=" "
                    required>
                <label for="sitio-web">Sucursal*</label>
                <div class="invalid-feedback">
                        Ingresa la sucursal
                </div>
            </div>
        </div>

    </form>
</div>

<script src="js/main.js"></script>
  
</body>
</html>
