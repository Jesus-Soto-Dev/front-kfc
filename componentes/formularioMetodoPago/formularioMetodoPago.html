<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metodo Pago</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="css/formularioMetodoPago.css">
</head>
<body>

<div class="container d-flex flex-column align-items-start ms-auto datos-container">

    <h2 class="text-uppercase title-form text-start">Método de Pago</h2>

    <form id="form-pago" class="row row-cols-1 row-cols-md-2 row-cols-lg-1 row-cols-xl-1 gy-5">

        <!-- Tipo de pago -->
        <div class="col d-flex flex-column px-3 px-lg-0">
            <div class="form-floating floating-bottom">
                <select id="tipo-pago" name="tipo-pago" class="form-select" required>
                    <option value="" selected></option>
                    <option>Tarjeta</option>
                    <option>Transferencia</option>
                    <option>PayPal</option>
                </select>
                <label for="tipo-pago">Método de pago*</label>
                <div class="invalid-feedback">Selecciona un método</div>
            </div>
        </div>

        <!-- Nombre titular -->
        <div class="col d-flex flex-column px-3 px-lg-0">
            <div class="form-floating floating-bottom">
                <input type="text" id="titular" name="titular" class="form-control" placeholder=" " required>
                <label for="titular">Nombre del titular*</label>
                <div class="invalid-feedback">Introduce el titular</div>
            </div>
        </div>

        <div class="col d-flex flex-column px-3 px-lg-0">
            <!-- Mes --> <!-- Año -->
            <div class="d-flex gap-3 fecha-group">
                <div class="col-4">
                    <label for="titular">Fecha de Caducidad*</label>
                </div>

                <div class="form-floating floating-bottom flex-fill col-4">
                    <select id="mes" name="mes" class="form-select" required>
                        <option value="" disabled selected></option>
                        <option>01</option><option>02</option><option>03</option>
                        <option>04</option><option>05</option><option>06</option>
                        <option>07</option><option>08</option><option>09</option>
                        <option>10</option><option>11</option><option>12</option>
                    </select>
                    
                    <label for="mes">Mes*</label>
                    <div class="invalid-feedback">Selecciona un mes</div>
                </div>

                <div class="form-floating floating-bottom flex-fill col-4">
                    <select id="anio" name="anio" class="form-select" required>
                        <option value="" disabled selected></option>
                        <option>2025</option>
                        <option>2026</option>
                        <option>2027</option>
                        <option>2028</option>
                    </select>
                    <label for="anio">Año*</label>
                    <div class="invalid-feedback">Selecciona un año</div>
                </div>
            </div>
        </div>
        <!-- CVV -->
        <div class="col d-flex flex-column px-3 px-lg-0">
            <div class="form-floating floating-bottom">
                <input type="text" id="cvv" name="cvv" class="form-control" placeholder=" " required>
                <label for="cvv">CVV*</label>
                <div class="invalid-feedback">CVV no válido</div>
            </div>
        </div>

    </form>
</div>

<script src="js/formularioMetodoPago.js"></script>
  
</body>
</html>
