<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos Direccion</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="css/formularioDireccion.css">
</head>
<body>

<div class="container d-flex flex-column align-items-start ms-auto datos-container direccion-container">
    <h2 class="fw-bold text-uppercase title-form 
           text-start">Datos de Dirección</h2>

    <form id="form-direccion" class="row row-cols-1 row-cols-md-2 row-cols-lg-1 row-cols-xl-1 gy-5">

        <!-- Tipo de vía -->

        <div class="col d-flex flex-column px-3 px-lg-0">
            
            <div class="form-floating floating-bottom">
                <select id="tipo-via" name="tipo-via" class="form-select" required>
                    <option value="" selected></option>
                    <option>Calle</option>
                    <option>Avenida</option>
                    <option>Paseo</option>
                    <option>Camino</option>
                    <option>Plaza</option>
                </select>
                <label for="tipo-via">Tipo de vía*</label>
                <div class="invalid-feedback">Selecciona el tipo de vía</div>
            </div>
        </div>

        <!-- Vía -->
        <div class="col d-flex flex-column px-3 px-lg-0">
            <div class="form-floating floating-bottom">
                <input type="text" id="via" name="via" class="form-control" placeholder=" " required>
                <label for="via">Vía*</label>
                <div class="invalid-feedback">Introduce la vía</div>
            </div>
        </div>

        <!-- Número -->
        <div class="col d-flex flex-column px-3 px-lg-0">
            <div class="form-floating floating-bottom">
                <input type="text" id="numero" name="numero" class="form-control" placeholder=" " required>
                <label for="numero">Número*</label>
                <div class="invalid-feedback">Introduce el número</div>
            </div>
        </div>

        <!-- Piso -->
        <div class="col d-flex flex-column px-3 px-lg-0">
            <div class="form-floating floating-bottom">
                <input type="text" id="piso" name="piso" class="form-control" placeholder=" " required>
                <label for="piso">Piso*</label>
                <div class="invalid-feedback">Introduce el Piso</div>
            </div>
        </div>

        <!-- Puerta -->
        <div class="col d-flex flex-column px-3 px-lg-0">
            <div class="form-floating floating-bottom">
                <input type="text" id="puerta" name="puerta" class="form-control" placeholder=" " required>
                <label for="puerta">Puerta*</label>
                <div class="invalid-feedback">Introduce la Puerta</div>
            </div>
        </div>

        <!-- Tipo de vivienda -->
        <div class="col d-flex flex-column px-3 px-lg-0">
            <div class="form-floating floating-bottom">
                <select id="tipo-vivienda" name="tipo-vivienda" class="form-select" required>
                    <option value="" selected></option>
                    <option>Chalet</option>
                    <option>Piso</option>
                    <option>Edificio</option>
                </select>
                <label for="tipo-vivienda">Tipo de vivienda*</label>
                <div class="invalid-feedback">Selecciona el tipo de vivienda</div>
            </div>
        </div>

        <!-- Código postal -->
        <div class="col d-flex flex-column px-3 px-lg-0">
            <div class="form-floating floating-bottom">
                <input type="text" id="cp" name="cp" class="form-control" placeholder=" " required>
                <label for="cp">Código postal*</label>
                <div class="invalid-feedback">Introduce el código postal</div>
            </div>
        </div>

        <!-- Provincia -->
        <div class="col d-flex flex-column px-3 px-lg-0">
            <div class="form-floating floating-bottom">
                <select id="provicia" name="provincia" class="form-select" required>
                    <option value="" selected></option>
                    <option>Salamanca</option>
                    <option>Soria</option>
                    <option>Segovia</option>
                </select>
                <label for="provincia">Provincia*</label>
                <div class="invalid-feedback">Selecciona la provincia</div>
            </div>
        </div>

        <!-- Localidad -->
        <div class="col d-flex flex-column px-3 px-lg-0">
            <div class="form-floating floating-bottom">
                <input type="text" id="localidad" name="localidad" class="form-control" placeholder=" " required>
                <label for="localidad">Localidad*</label>
                <div class="invalid-feedback">Introduce la localidad</div>
            </div>
        </div>

        <!-- País -->
        <div class="col d-flex flex-column px-3 px-lg-0">
            <div class="form-floating floating-bottom">
                <select id="pais" name="pais" class="form-select" required>
                    <option value="" selected></option>
                    <option>España</option>
                    <option>Portugal</option>
                    <option>Francia</option>
                </select>
                <label for="pais">País*</label>
                <div class="invalid-feedback">Selecciona un país</div>
            </div>
        </div>

    </form>
</div>

<script src="js/formularioDireccion.js"></script>
  
</body>
</html>
