<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container"> 
    <h2 class="fw-bold text-uppercase title-form">Datos de contacto</h2>
    <form action="" class="row row-cols-1">

        <div class="col d-flex flex-column m-4">
            <div class="form-floating floating-bottom">
                <input 
                    type="tel" 
                    name="telefono-movil" 
                    id="telefono-movil" 
                    class="form-control" 
                    placeholder=" ">
                <label for="telefono-movil" class="label-form">Teléfono móvil*</label>
            </div>
        </div>

        <div class="col d-flex flex-column m-4">
            <div class="form-floating floating-bottom">
                <input 
                    type="tel" 
                    name="telefono-fijo" 
                    id="telefono-fijo" 
                    class="form-control" 
                    placeholder=" ">
                <label for="telefono-fijo">Teléfono fijo*</label>
            </div>
        </div>

        <div class="col d-flex flex-column m-4">
            <div class="form-floating floating-bottom">
                <input 
                    type="email" 
                    name="correo-electronico" 
                    id="correo-electronico" 
                    class="form-control" 
                    placeholder=" ">
                <label for="correo-electronico">Correo electrónico*</label>
            </div>
        </div>

        <div class="col d-flex flex-column m-4">
            <div class="form-floating floating-bottom">
                <input 
                    type="text" 
                    name="perfil-linkedin" 
                    id="perfil-linkedin" 
                    class="form-control" 
                    placeholder=" ">
                <label for="perfil-linkedin">Perfil de LinkedIn*</label>
            </div>
        </div>

        <div class="col d-flex flex-column m-4">
            <div class="form-floating floating-bottom">
                <input 
                    type="text" 
                    name="perfil-twitter" 
                    id="perfil-twitter" 
                    class="form-control" 
                    placeholder=" ">
                <label for="perfil-twitter">Perfil de Twitter*</label>
            </div>
        </div>

        <div class="col d-flex flex-column m-4">
            <div class="form-floating floating-bottom">
                <input 
                    type="text" 
                    name="sitio-web" 
                    id="sitio-web" 
                    class="form-control" 
                    placeholder=" ">
                <label for="sitio-web">Sitio web profesional*</label>
            </div>
        </div>

    </form>
</div>
  
</body>
</html>
