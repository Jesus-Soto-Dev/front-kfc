<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>


<div class="container m-1">
    <h2 class="title-form-producto text-uppercase fw-bold m-5">Producto principal</h2>
    <div class="row row-cols-1 row-cols-lg-3 d-flex justify-content-center gap-5 align-items-center">
        <div class="col">
            <button type="button" class="btn btn-danger boton-plan w-100 p-5">
                <span class="fw-light">
                    Plan básico
                </span>
            </button>
        </div>
         <div class="col">
            <button type="button" class="btn btn-danger boton-plan w-100 p-5">
                <span class="fw-light">
                    Plan pro
                </span>
            </button>
        </div>
         <div class="col">
            <button type="button" class="btn btn-danger boton-plan w-100 p-5">
                 <span class="fw-light">
                    Plan premiun
                </span>
            </button>
        </div>
    </div>

    <h2 class="title-form-producto text-uppercase fw-bold m-5">Productos secundarios</h2>
    <div class="row row-cols-1 row-cols-lg-3 d-flex justify-content-center gap-5 align-items-center">
        <div class="col">
            <button type="button" class="btn btn-danger boton-plan w-100 p-5">
                <span class="fw-light">
                    Seguro Antirrobo
                </span>
            </button>
        </div>
         <div class="col">
            <button type="button" class="btn btn-danger boton-plan w-100 p-5">
                <span class="fw-light">
                    Instalación en casa
                </span>
            </button>
        </div>
         <div class="col">
            <button type="button" class="btn btn-danger boton-plan w-100 p-5">
                 <span class="fw-light">
                    Entrega a pie de calle 
                </span>
            </button>
        </div>
    </div>
</div>

<script src="js/main.js"></script>
  
</body>
</html>
