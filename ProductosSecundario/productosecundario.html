<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFC-FRONT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="productoprincipal.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <section class="kfc-image col-lg-6">

            </section>
            <section class="Producto-principal col-lg-6">
                <h1>Producto principal</h1>
                <div class="container mt-4">
                    <div class="row">
                        <!-- Seguro -->
                        <div class="col-12 col-md-6 col-lg-4 mb-3">
                            <div class="card p-3 text-center bg-danger text-white">Seguro antirrobo</div>
                        </div>

                        <!-- Instalación -->
                        <div class="col-12 col-md-6 col-lg-4 mb-3">
                            <div class="card p-3 text-center bg-danger text-white">Instalación en casa</div>
                        </div>

                        <!-- Entraga -->
                        <div class="col-12 col-md-6 offset-md-3 col-lg-4 offset-lg-0 mb-3">
                            <div class="card p-3 text-center bg-danger text-white">Entrega a pie de calle</div>
                        </div>
                    </div>
                </div>
        </div>
    </div>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
